# Run unit tests on every push and PR. Gates merges on test passage.
---
name: "Tests"

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test.yml'
      - 'src/**'
      - 'test/**'
      - 'remote-ui.pro'
      - 'tools/check_touchslider_guards.py'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

env:
  QT_VERSION: "5.15.2"

jobs:
  unit-tests:
    name: "Unit tests (C++)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          modules: ""

      - name: Build unit tests
        working-directory: test/matrixrain
        run: |
          qmake matrixrain_test.pro "QMAKE_CXXFLAGS += -fsanitize=address -fno-omit-frame-pointer" "QMAKE_LFLAGS += -fsanitize=address"
          make -j$(nproc)

      - name: Run unit tests
        working-directory: test/matrixrain
        run: ./test_matrixrain -v2 -o results.xml,xunitxml
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=0

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test/matrixrain/results.xml

  qml-tests:
    name: "QML settings tests"
    runs-on: ubuntu-latest
    # QML tests import QtGraphicalEffects (GradientText) which needs a GL context.
    # xvfb + Mesa provides software-rendered GL on headless CI.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          modules: ""

      - name: Install Mesa for software OpenGL
        run: sudo apt-get update && sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri

      - name: Build QML tests
        working-directory: test/qml
        run: |
          qmake matrixrain_qml_test.pro
          make -j$(nproc)

      - name: Run QML tests
        working-directory: test/qml
        run: xvfb-run --auto-servernum ./test_qml -v2 -o results.xml,xunitxml
        env:
          QT_QUICK_BACKEND: software

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qml-test-results
          path: test/qml/results.xml

  integration-tests:
    name: "Integration tests (QML)"
    runs-on: ubuntu-latest
    # Integration tests require OpenGL context (QSGGeometryNode rendering).
    # xvfb + Mesa provides a software-rendered GL context on headless CI.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          modules: ""

      - name: Install Mesa for software OpenGL
        run: sudo apt-get update && sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri

      - name: Build integration tests
        working-directory: test/integration
        run: |
          qmake matrixrain_integration_test.pro "QMAKE_CXXFLAGS += -fsanitize=address -fno-omit-frame-pointer" "QMAKE_LFLAGS += -fsanitize=address"
          make -j$(nproc)

      - name: Run integration tests
        working-directory: test/integration
        run: xvfb-run --auto-servernum ./test_integration -v2 -o results.xml,xunitxml
        env:
          QT_QUICK_BACKEND: software
          ASAN_OPTIONS: detect_leaks=0

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: test/integration/results.xml

  setpowermode-drift:
    name: "setPowerMode field-name drift check"
    runs-on: ubuntu-latest
    # Fast standalone job (no Qt install needed). Verifies the v1.4.22 setPowerMode
    # body field name (`mode`, not `power_mode`) is present in both production
    # (src/core/core.cpp) and the regression-prevention mock (test/hardware/mock_core_api.cpp).
    # Closes the verbatim-mirror drift gap that the keeper/suppressor body-shape unit tests
    # alone can't catch (a co-ordinated regression of both files would still pass tests).

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run drift check
        run: python3 tools/check_setPowerMode_drift.py

  touchslider-guards:
    name: "Touch slider screensaver guards"
    runs-on: ubuntu-latest
    # Fast standalone job (no Qt install needed). The four touch slider overlays
    # (src/qml/components/TouchSlider{Volume,Brightness,Position,Seek}.qml) are upstream files that carry our
    # screensaver guards; the v1.6.0 merge dropped one without anyone noticing. Names each guard a merge drops,
    # file by file (tools/check_touchslider_guards.py). The behaviour itself is tested by the QML job
    # (test/qml/tst_touch_slider_screensaver.qml).

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run guard check
        run: python3 tools/check_touchslider_guards.py

  upstream-unit-tests:
    name: "Upstream unit tests (CMake)"
    runs-on: ubuntu-24.04
    # Unfolded Circle's own unit tests (test/CMakeLists.txt, merged with upstream v0.84.0). They cover the entity
    # layer, the artwork pipeline, the input controller, power, Wi-Fi and the models that our mods change, plus our
    # browse-preview cases in test/ui/test_entity_controller.cpp. Upstream's build.yml runs five of the programs;
    # this job runs every one that is built. Qt as in upstream's unit-tests job, plus the `icu` archive: Qt 5.15.2's
    # libQt5Core links ICU 56, which Ubuntu 24.04 does not ship (upstream builds ICU 56 from source instead).

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qtvirtualkeyboard'
          archives: 'icu qtbase qtdeclarative qtmultimedia qtquickcontrols2 qtsvg qttools qtwebsockets'
          cache: true
          cache-key-prefix: ${{ env.QT_VERSION }}-upstream-unit-tests-icu

      - name: Build upstream unit tests
        run: |
          mkdir test/build
          cd test/build
          cmake -D CMAKE_PREFIX_PATH="$QT_ROOT_DIR" ..
          cmake --build . -j$(nproc)

      - name: Run upstream unit tests
        working-directory: test/build
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          failed=0
          for t in $(find . -maxdepth 2 -type f -executable -name 'test*' | sort); do
            echo "::group::$t"
            (cd "$(dirname "$t")" && "./$(basename "$t")") || { failed=1; echo "::error::$t failed"; }
            echo "::endgroup::"
          done
          exit $failed

  hardware-tests:
    name: "Hardware tests (Mod 5 + Mod 6 + EntityController)"
    runs-on: ubuntu-latest
    # Mod 5 (ActivitySessionKeeper) + Mod 6 (PhantomWakeSuppressor) unit tests.
    # 49 test methods covering body-shape regression-prevention, evaluateSession truth tables,
    # grace cancellation paths, input-lookback skip-grace, and signal lifecycle.
    # Mirrors the `unit-tests` (matrixrain) job structure for consistency.

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # keeper_test.pro / suppressor_test.pro pull src/util.cpp and util.h
          # via mock_core_api.cpp; util.h:13 includes the QR-Code-generator
          # submodule. Default checkout skips submodules → fatal compile error.
          submodules: recursive

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          modules: ""

      - name: Build hardware tests
        working-directory: test/hardware
        run: |
          qmake hardware_test.pro "QMAKE_CXXFLAGS += -fsanitize=address -fno-omit-frame-pointer" "QMAKE_LFLAGS += -fsanitize=address"
          make -j$(nproc)

      - name: Run keeper tests (Mod 5)
        working-directory: test/hardware/keeper_test
        run: ./test_activitySessionKeeper -v2 -o keeper_results.xml,xunitxml
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=0

      - name: Run suppressor tests (Mod 6)
        working-directory: test/hardware/suppressor_test
        run: ./test_phantomWakeSuppressor -v2 -o suppressor_results.xml,xunitxml
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=0

      - name: Run entityController tests (resume-window state machine)
        working-directory: test/hardware/entityController_test
        run: ./test_entityController -v2 -o entityController_results.xml,xunitxml
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=0

      - name: Run power tests (window hidden while the display is off)
        working-directory: test/hardware/power_test
        run: ./test_power -v2 -o power_results.xml,xunitxml
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=0

      - name: Run screen-off sync tests (display off when the screen-off animation ends)
        working-directory: test/hardware/screenoff_test
        run: ./test_screenOffSync -v2 -o screenoff_results.xml,xunitxml
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=0

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardware-test-results
          path: |
            test/hardware/keeper_test/keeper_results.xml
            test/hardware/suppressor_test/suppressor_results.xml
            test/hardware/entityController_test/entityController_results.xml
            test/hardware/power_test/power_results.xml
            test/hardware/screenoff_test/screenoff_results.xml
