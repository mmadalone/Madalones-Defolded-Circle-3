# GitHub Action to build the remote-ui Qt project as a static Qt app for the Remote 3 and, for release builds,
# as a static Linux x64 desktop simulator. Both are built in the Docker toolchain images of
# https://github.com/unfoldedcircle/ucr2-toolchain (see docs/cross-compile.md and docs/static-compile.md).
#
# madalone (v1.6.6): rebuilt on upstream's v0.84.0 workflow, which this file had not followed since the merge with
# it: the read-only default token, the pinned actions and the static builds are upstream's. Ours, each marked
# "# madalone" below: the push trigger and paths, the version gate, the tests from test.yml in place of upstream's
# unit-tests job, the digest-pinned images, the UCR3 install bundle and its check, and two release jobs (a
# Development Build for main, a signed release for a tag) that publish with GitHub's own `gh` instead of a
# third-party action. docs/UPSTREAM_MERGE.md lists the differences for the next merge.
---
name: "Build & Release"

on:
  # madalone: every branch but i18n is built on push: the fork works without pull requests (upstream builds only
  # main and release tags on push)
  push:
    branches-ignore:
      - i18n
    paths:
      - '.github/**/*.yml'
      - '.gitmodules'
      - 'remote-ui.pro'
      - 'resources/**'
      - 'src/**'
      - 'test/**'
      - 'tools/**'
      # madalone: what else the jobs below read
      - '3rd-party/**'
      - 'deploy/**'
      - 'docs/release-pubkey.asc'
      - 'scripts/**'
      - 'version.txt.in'
    tags:
      # This is not regex: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#filter-pattern-cheat-sheet
      - v[0-9]+.[0-9]+.[0-9]+*
  # madalone: no path filter, every pull request is built and tested (upstream filters them like pushes)
  pull_request:
    branches:
      - main
    types: [ opened, synchronize, reopened ]
  # Allow a manual build from the Actions tab. Path filters don't apply to a manual run.
  workflow_dispatch:
    # madalone: a manual run builds both targets; with this box ticked it also runs the release job's steps
    inputs:
      release_dry_run:
        description: "Also run the release steps (sign, verify, notes) without publishing"
        type: boolean
        default: false

# Avoid duplicate and superseded runs: a new push to a branch cancels the previous run. Release builds are never
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

# Least privilege default for the job token. The release jobs raise it to contents: write.
permissions:
  contents: read

env:
  QT_VERSION: 5.15.2
  APP_PRO: remote-ui.pro
  APP_NAME: remote-ui
  PROJECT_NAME: remote-ui
  # Build artifact output path. Used to set project specific UC_BIN env var.
  BIN_OUTPUT_PATH: "binaries"
  DEBUG_OUTPUT: "false"
  # Use cmake shell for platform independent builds. Otherwise, it only works on Linux!
  USE_CMAKE_SHELL: "true"
  HASH_FILENAME: remote-ui.hash

jobs:
  # madalone: remote-ui.pro, deploy/release.json and (on a tag) the tag name one version, and on a tag a CHANGELOG
  # section for it. Runs before the builds.
  version-sync-check:
    name: Version sync gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check VERSION consistency across artifacts
        shell: bash
        run: |
          PRO_VERSION=$(grep '^VERSION = ' remote-ui.pro | awk '{print $3}')
          # json.load, not grep: a release.json that is not valid JSON fails here, not on a user's remote
          JSON_VERSION=$(python3 -c 'import json; print(json.load(open("deploy/release.json", encoding="utf-8"))["version"])')
          echo "remote-ui.pro VERSION:   $PRO_VERSION"
          echo "deploy/release.json:     $JSON_VERSION"
          if [ -z "$PRO_VERSION" ] || [ -z "$JSON_VERSION" ]; then
            echo "::error::Failed to extract one of the versions"
            exit 1
          fi
          if [ "$PRO_VERSION" != "$JSON_VERSION" ]; then
            echo "::error::Version mismatch: remote-ui.pro=$PRO_VERSION release.json=$JSON_VERSION"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            if [ "$PRO_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::Tag $TAG_VERSION does not match .pro VERSION $PRO_VERSION"
              exit 1
            fi
            echo "Tag version matches: $TAG_VERSION"
          fi
          echo "Version sync OK: $PRO_VERSION"
      - name: CHANGELOG sync gate (tagged releases only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          # The release job publishes this section as the release notes (tools/release_notes.py)
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          python3 tools/release_notes.py "$TAG_VERSION" > /dev/null
          echo "CHANGELOG.md has a section for $TAG_VERSION"

  # madalone: the fork's test suites (C++, QML, integration, hardware, upstream's unit tests, the guard scripts) in
  # place of upstream's unit-tests job. They run beside the builds; both release jobs need them.
  tests:
    name: Tests
    uses: ./.github/workflows/test.yml

  # The static builds run in Docker toolchain images. The Linux x64 desktop simulator is only built for release
  # builds (push to main and version tags), not for pull requests, so the matrix is computed here.
  build-matrix:
    name: Build matrix
    runs-on: ubuntu-latest
    outputs:
      config: ${{ steps.matrix.outputs.config }}
    steps:
      - name: Select the static build targets
        id: matrix
        shell: bash
        run: |
          # madalone: the device target is named UCR3 (upstream: UCR2) and "bundle" marks it as the one that is
          # staged as a firmware install bundle. Both images are pinned by digest, so a release can be rebuilt from
          # the same toolchain; BUILD.md ("Toolchain pinning rationale") pins the same two and tells how to rotate.
          UCR3='{ "name": "UCR3 aarch64", "artifact": "UCR3", "build": "static", "output": "linux-arm64/release",
                  "build-image": "unfoldedcircle/r2-toolchain-qt-5.15.19-static@sha256:7d8fbf28308bd1c5628921fd79e10fe4cde17bbbea5efd0ec64606782feb271f", "bundle": true }'
          LINUX_X64='{ "name": "Linux x64 desktop", "artifact": "Linux-x64", "build": "static", "output": "linux-x64/release",
                       "build-image": "unfoldedcircle/remote-ui-toolchain-qt-5.15.19-static-x64@sha256:5e16e99c575c1571051fe3de8100163c3537a61916e1decf7e0d28ef0c3e5396", "bundle": false }'
          # madalone: also on a manual run
          if [[ "$GITHUB_REF" == "refs/heads/main" || "$GITHUB_REF" == refs/tags/v* || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            CONFIG="[$UCR3, $LINUX_X64]"
          else
            CONFIG="[$UCR3]"
          fi
          echo "config=$(echo "$CONFIG" | tr -d '\n')" >> "$GITHUB_OUTPUT"
          echo "$CONFIG"

  build-static:
    name: ${{ matrix.config.name }}
    runs-on: ubuntu-latest
    # madalone: after the version gate (upstream: after its unit tests)
    needs: [version-sync-check, build-matrix]
    strategy:
      matrix:
        config: ${{ fromJSON(needs.build-matrix.outputs.config) }}

    steps:
      - name: Checkout ${{ env.PROJECT_NAME }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # history and tags required to determine number of commits since last release tag
          fetch-depth: 0
          path: ${{ env.PROJECT_NAME }}
          submodules: recursive

      - name: Set build output directory
        shell: bash
        run: |
          # the toolchain images write to binaries/<platform>/release (default path of remote-ui.pro, or UC_BIN)
          mkdir ${{ env.PROJECT_NAME }}/build
          mkdir ${{ env.PROJECT_NAME }}/${{env.BIN_OUTPUT_PATH }}
          echo "UC_BIN=${GITHUB_WORKSPACE}/${{ env.PROJECT_NAME }}/${BIN_OUTPUT_PATH}/${{ matrix.config.output }}" >> $GITHUB_ENV

      - name: Build in the Docker toolchain image
        run: |
          docker pull ${{ matrix.config.build-image }}
          docker run --rm  \
              --user=$(id -u):$(id -g) \
              -v ${GITHUB_WORKSPACE}/${{ env.PROJECT_NAME }}:/sources \
              ${{ matrix.config.build-image }}
      - name: Set build artifact name
        shell: bash
        run: |
          cd ${{ env.PROJECT_NAME }}
          APP_VERSION=$(git describe --match "v[0-9]*" --tags HEAD --always)
          echo "App version: $APP_VERSION"
          echo "$APP_VERSION" > ${{ env.UC_BIN }}/version.txt
          echo "ARTIFACT_NAME=${{ env.APP_NAME }}-$APP_VERSION-${{ matrix.config.artifact }}-${{ matrix.config.build }}" >> $GITHUB_ENV

      # madalone (post-v1.4.21): stage the firmware's expected install-bundle layout
      # (release.json + bin/remote-ui + config/) before tarring. The /api/system/install/ui
      # endpoint expects the binary at bin/remote-ui: a tarball of the raw build directory
      # (binary at root + version.txt) is refused with "Missing file: remote-ui".
      - name: Stage install bundle
        if: matrix.config.bundle
        shell: bash
        run: |
          STAGING="${GITHUB_WORKSPACE}/install-bundle"
          mkdir -p "${STAGING}/bin" "${STAGING}/config"
          cp "${GITHUB_WORKSPACE}/${{ env.PROJECT_NAME }}/deploy/release.json" "${STAGING}/"
          # Every file of deploy/config/ goes into config/: the charging-screen JSON, the CJK font with its licence
          # and the sound files (UI clicks + dock chimes: 10 at v1.4.41, 16 since v1.4.42). This step used to copy
          # only the JSON and the font, by name, so no GitHub release from v1.4.41 to v1.5.3 shipped any sound
          # (v1.5.4).
          # The firmware rejects sub-directories under config/ ("Could not extract archive").
          CONFIG_SRC="${GITHUB_WORKSPACE}/${{ env.PROJECT_NAME }}/deploy/config"
          if [ -n "$(find "${CONFIG_SRC}" -mindepth 1 -type d)" ]; then
            echo "::error::deploy/config must not contain sub-directories: the firmware rejects them"
            exit 1
          fi
          cp "${CONFIG_SRC}"/* "${STAGING}/config/"
          cp "${{ env.UC_BIN }}/remote-ui" "${STAGING}/bin/"
          # version.txt at the root names the build (`git describe`); the firmware's install ignores it
          cp "${{ env.UC_BIN }}/version.txt" "${STAGING}/"
          echo "=== Staging contents ==="
          find "${STAGING}" -type f | sort

      # Archive is required to preserve file permissions and re-used for release uploads
      - name: Create upload artifact
        shell: bash
        run: |
          # madalone: the UCR3 target is packed from the staged install bundle, drop-in usable with the firmware's
          # /api/system/install/ui?void_warranty=yes (README.md)
          if [ "${{ matrix.config.bundle }}" = "true" ]; then
            SOURCE="${GITHUB_WORKSPACE}/install-bundle"
          else
            SOURCE="${{ env.UC_BIN }}"
          fi
          # ARTIFACT_NAME as a shell variable, not pasted into the script: it holds a tag name
          tar czvf "${ARTIFACT_NAME}.tar.gz" -C "${SOURCE}" .
          ls -lah

      # madalone (v1.6.6): the tarball itself is checked before it can be uploaded: the layout, release.json, the
      # binary and its version, every file of config/ (tools/check_bundle.py tells why each check exists)
      - name: Check the install bundle
        if: matrix.config.bundle
        shell: bash
        run: |
          TARBALL="${GITHUB_WORKSPACE}/${ARTIFACT_NAME}.tar.gz"
          cd ${{ env.PROJECT_NAME }}
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            python3 tools/check_bundle.py "${TARBALL}" --tag "${GITHUB_REF#refs/tags/}"
          else
            python3 tools/check_bundle.py "${TARBALL}"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload_artifact
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}.tar.gz
          if-no-files-found: error
          retention-days: 3

  # madalone (v1.6.6): two release jobs in place of upstream's one. Both wait for the tests and the builds, and
  # both publish with `gh`, GitHub's own command-line tool, which is on every hosted runner: no third-party action
  # runs with the write token (up to v1.6.5: marvinpinto/action-automatic-releases@latest, unpinned and archived).
  #
  # Development Build: every push to main that runs this workflow (the paths above) replaces the "latest"
  # pre-release. Unsigned, as before.
  release-dev:
    name: Development Build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [tests, build-static]
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # the builds only: the test jobs' result files are artifacts of this run too
          pattern: ${{ env.APP_NAME }}-*
          merge-multiple: true

      # Use a common timestamp for all matrix build artifacts
      - name: Add the timestamp and write the hash file
        shell: bash
        run: |
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          for filename in *.tar.gz; do mv "$filename" "$(basename "$filename" .tar.gz)-${TIMESTAMP}.tar.gz"; done
          for filename in *.tar.gz; do echo "sha256  $(sha256sum "$filename")" >> "${HASH_FILENAME}"; done
          cat "${HASH_FILENAME}"

      # `gh release create` only adds to a release, so the previous "latest" goes first, with its tag: the new tag
      # is then made on the commit that was built (--target), not on whatever main points to by now.
      # --target only counts for a tag that does not exist yet. So only "there is no such release" is let through
      # here, and a "latest" tag that outlived its release (a delete that stopped half-way) is removed as well:
      # otherwise every later Development Build would sit on that old commit, with a green run.
      - name: Replace the "latest" pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view latest > /dev/null 2>&1; then
            gh release delete latest --cleanup-tag --yes
          fi
          if gh api "repos/${GH_REPO}/git/ref/tags/latest" --silent 2> /dev/null; then
            gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/latest" --silent
          fi
          gh release create latest --prerelease --latest=false --target "${GITHUB_SHA}" \
              --title "Development Build" \
              --notes "Built from \`main\` at ${GITHUB_SHA}. Not a release: it has passed the tests, but nobody has tried it on a remote. The files are unsigned; \`scripts/verify-release.sh --checksum-only\` checks the download." \
              --generate-notes \
              *.tar.gz "${HASH_FILENAME}"

  # Release: a pushed tag vX.Y.Z publishes the signed release. A manual run with "release_dry_run" does every step
  # but the last, on any branch or tag: only a push publishes, also when the manual run is started from a tag.
  release:
    name: Create Release
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.release_dry_run)
    runs-on: ubuntu-latest
    needs: [tests, build-static]
    permissions:
      contents: write

    steps:
      # the scripts, the public key and the changelog of the commit that was built
      - name: Checkout ${{ env.PROJECT_NAME }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ${{ env.PROJECT_NAME }}

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # the builds only: the test jobs' result files are artifacts of this run too
          pattern: ${{ env.APP_NAME }}-*
          merge-multiple: true
          path: assets

      - name: Write the hash file
        shell: bash
        working-directory: assets
        run: |
          for filename in *.tar.gz; do echo "sha256  $(sha256sum "$filename")" >> "${HASH_FILENAME}"; done
          cat "${HASH_FILENAME}"

      # GPG-sign the release files (docs/RELEASE_SIGNING.md). Without the key nothing is published: up to v1.6.5
      # a missing secret gave an unsigned release with a notice in the log.
      # The key lives in a keyring of its own that is gone before the next step.
      - name: Sign the release files
        shell: bash
        working-directory: assets
        env:
          GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::RELEASE_GPG_PRIVATE_KEY is not set: a release is not published unsigned (docs/RELEASE_SIGNING.md)"
            exit 1
          fi
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          for filename in *.tar.gz; do
            echo "signing $filename"
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
                --detach-sign --armor --output "${filename}.asc" "$filename" 3<<<"$GPG_PASSPHRASE" \
                || { echo "::error::Signing $filename failed. If the key has a passphrase: is RELEASE_GPG_PASSPHRASE set? (docs/RELEASE_SIGNING.md)"; exit 1; }
          done
          gpgconf --kill gpg-agent || true
          rm -rf "$GNUPGHOME"
          ls -la *.asc

      # The check a user runs, on the files a user gets: the hash, and a signature by the key in
      # docs/release-pubkey.asc. A secret that holds another key stops the release here.
      - name: Verify the release files
        shell: bash
        working-directory: assets
        run: |
          for filename in *.tar.gz; do
            bash "../${{ env.PROJECT_NAME }}/scripts/verify-release.sh" "$filename" "${HASH_FILENAME}" "${filename}.asc"
          done

      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(grep '^VERSION = ' "${{ env.PROJECT_NAME }}/remote-ui.pro" | awk '{print $3}')
          fi
          python3 "${{ env.PROJECT_NAME }}/tools/release_notes.py" "$VERSION" \
              --changelog "${{ env.PROJECT_NAME }}/CHANGELOG.md" > release-notes.md
          echo "Notes for $VERSION: $(wc -c < release-notes.md) bytes"
          head -n 12 release-notes.md

      # --verify-tag: only for a tag that is on GitHub already (the pushed one). gh uploads the files to a draft
      # and publishes the release when they are all there.
      - name: Publish the release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file ../release-notes.md \
              *.tar.gz *.asc "${HASH_FILENAME}"

      - name: Dry run - what a tag would publish
        if: github.event_name != 'push'
        shell: bash
        run: |
          echo "Nothing was published. A tag would upload:"
          ls -la assets
          cat "assets/${HASH_FILENAME}"
